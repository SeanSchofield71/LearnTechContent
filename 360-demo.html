<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Cave 360</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <style>
       height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        #panorama {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="panorama"></div>

<script>
    pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: 'Hero cave.png',
        autoLoad: true,
        showControls: true
    });
</script>

</body>
</html>
