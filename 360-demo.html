<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Cave 360</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #panorama {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="panorama"></div>

<script>
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href =
        "https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css";
    document.head.appendChild(css);

    const js = document.createElement("script");
    js.src =
        "https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js";

    js.onload = function () {
        pannellum.viewer("panorama", {
            type: "equirectangular",
            panorama: "Hero cave.png",
            autoLoad: true,
            showControls: true,
            pitch: 0,
            yaw: 0,
            hfov: 100,
            minHfov: 40,
            maxHfov: 120
        });
    };

    js.onerror = function () {
        document.getElementById("panorama").innerHTML =
            '<p style="color:white;font-family:Arial;padding:30px;">360 viewer failed to load.</p>';
    };

    document.head.appendChild(js);
</script>

</body>
</html>
