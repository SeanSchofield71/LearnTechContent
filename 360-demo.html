<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Cave 360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    html, body, #panorama { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    window.addEventListener("load", function () {
      pannellum.viewer("panorama", {
        type: "equirectangular",
        panorama: "Hero%20cave.png",
        autoLoad: true,
        showControls: true,
        pitch: 0,
        yaw: 0,
        hfov: 100,
        minHfov: 40,
        maxHfov: 120
      });
    });
  </script>
</body>
</html>
