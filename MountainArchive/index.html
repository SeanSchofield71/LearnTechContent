<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mountain Archive: Code Fragment 1</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a0e;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle at center,
        #293442 0%,
        #111820 50%,
        #05070a 100%
      );
    }

    .instruction {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 18px;
      padding: 12px;
      color: #f4e7c0;
      background: rgba(4, 7, 10, 0.8);
      border: 1px solid #d0a64c;
      border-radius: 10px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <model-viewer
    src="fragment.glb"
    alt="Interactive 3D code fragment"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1.2"
    exposure="1.1"
    environment-image="neutral">
  </model-viewer>
