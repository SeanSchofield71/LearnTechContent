<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Briefcase Test</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #20242a;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #20242a;
    }

    .instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      background: rgba(0,0,0,0.65);
      padding: 12px 20px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <model-viewer
    src="basic_black_briefcase.glb"
    alt="3D black briefcase"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1.2"
    interaction-prompt="auto">
  </model-viewer>

  <div class="instructions">
    Drag to rotate • Scroll or pinch to zoom
  </div>

</body>
</html>
